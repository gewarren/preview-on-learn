<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Preview on Learn</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            width: 320px;
            padding: 15px;
        }

        h2 {
            margin-top: 0;
            color: #1c34ab;
        }

        p {
            color: #333;
            line-height: 1.5;
        }

        .info {
            background-color: #f6f8fa;
            border-radius: 6px;
            padding: 12px;
            margin: 10px 0;
        }

        a {
            color: #0366d6;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h2>Preview on Learn</h2>

    <div class="info">
        <p>This extension adds a "Preview on Learn" button to GitHub PR file views for Microsoft Learn documentation
            repos.</p>
    </div>

    <p>Navigate to a pull request in a MicrosoftDocs repo to see the preview buttons on each changed file.</p>

    <p><a href="https://github.com/gewarren/preview-on-learn" target="_blank">View on GitHub →</a></p>

    <script src="dist/popup.bundle.js"></script>
</body>

</html>
